
# =============================================================================
# WebStock Production Compose — Image-Based Deployment
#
# No source code required. Only needs:
#   - This file (docker-compose.prod.yml)
#   - .env file with secrets
#   - (Optional) nginx/ssl/ directory for TLS certs
#
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Update:
#   docker compose -f docker-compose.prod.yml pull app
#   docker compose -f docker-compose.prod.yml up -d app
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database (pgvector)
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: webstock-postgres
    environment:
      - POSTGRES_USER=webstock
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-webstock}
      - POSTGRES_DB=webstock
      - PGDATA=/var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "max_worker_processes=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "jit=off"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_min_duration_statement=1000"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webstock -d webstock"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - webstock-network
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ===========================================================================
  # Redis (shared cache + message broker)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: webstock-redis
    command: >
      redis-server
      --maxmemory 512mb --maxmemory-policy allkeys-lru
      --appendonly yes --save 900 1 --save 300 10
    volumes:
      - redis_data:/data
    networks:
      - webstock-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ===========================================================================
  # RSSHub (RSS feed aggregator)
  # ===========================================================================
  rsshub:
    image: diygod/rsshub:latest
    container_name: webstock-rsshub
    environment:
      - NODE_ENV=production
      - CACHE_TYPE=redis
      - REDIS_URL=redis://redis:6379/4
      - CACHE_EXPIRE=300
      - REQUEST_TIMEOUT=30000
      - LISTEN_INADDR_ANY=1
      - ACCESS_KEY=${RSSHUB_ACCESS_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - webstock-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:1200/',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

  # ===========================================================================
  # App (Backend + Frontend + Worker + Beat + AI Gateway + Nginx)
  # ===========================================================================
  app:
    image: ghcr.io/avesed/webstock:latest
    container_name: webstock-app
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      - DATABASE_URL=postgresql+asyncpg://webstock:${POSTGRES_PASSWORD:-webstock}@postgres:5432/webstock?ssl=disable
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_SECRET_KEY_PREVIOUS=${JWT_SECRET_KEY_PREVIOUS:-}
      - DEBUG=false
      - ENVIRONMENT=production
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_CLAIMS_EMAIL=${VAPID_CLAIMS_EMAIL:-admin@webstock.local}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - RSSHUB_URL=${RSSHUB_URL:-http://rsshub:1200}
      - RSSHUB_ACCESS_KEY=${RSSHUB_ACCESS_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - PLAYWRIGHT_SERVICE_URL=${PLAYWRIGHT_SERVICE_URL:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
      - AI_GATEWAY_URL=http://127.0.0.1:8004
      - USE_AI_GATEWAY=${USE_AI_GATEWAY:-false}
      - STOCKPULSE_URL=${STOCKPULSE_URL:-}
      - STOCKPULSE_API_KEY=${STOCKPULSE_API_KEY:-}
      - ALPHAFORGE_URL=${ALPHAFORGE_URL:-}
      - ALPHAFORGE_API_KEY=${ALPHAFORGE_API_KEY:-}
      - NEWSFORGE_URL=${NEWSFORGE_URL:-}
      - NEWSFORGE_API_KEY=${NEWSFORGE_API_KEY:-}
      - NEWSFORGE_WEBHOOK_SECRET=${NEWSFORGE_WEBHOOK_SECRET:-}
      - FIRST_ADMIN_EMAIL=${FIRST_ADMIN_EMAIL:-}
      # CORS_ORIGINS is a pydantic list[str] (json.loads): MUST be a JSON array.
      # Default ["*"] so an unset value still boots — an empty string would crash
      # config load (and take down migrations + Celery). Restrict in .env.
      - CORS_ORIGINS=${CORS_ORIGINS:-["*"]}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/app/data
      # Uncomment to enable TLS:
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - webstock-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

# =============================================================================
# Networks
# =============================================================================
networks:
  webstock-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_data:
    driver: local
