[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ============ FastAPI Backend ============
[program:backend]
command=/opt/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 2 --loop uvloop --http httptools --no-access-log
directory=/app/backend
user=appuser
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=5
stopwaitsecs=30
environment=PYTHONPATH="/app/backend:/app",LOG_TAG="web"

# ============ Celery Worker ============
[program:celery-worker]
command=/opt/venv/bin/celery -A worker.celery_app worker --loglevel=info --concurrency=4 -Q celery,scraping,default
directory=/app
user=appuser
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=5
stopwaitsecs=60
stopasgroup=true
killasgroup=true
environment=PYTHONPATH="/app/backend:/app",LOG_TAG="worker"

# ============ Celery Worker (Daily Bars) ============
# Dedicated low-concurrency worker for long-running daily bar tasks (hours each).
# Isolated from the main worker so periodic tasks (price alerts, news) stay responsive.
[program:celery-worker-daily-bars]
command=/opt/venv/bin/celery -A worker.celery_app worker --loglevel=info --concurrency=1 -Q daily_bars -n daily_bars@%%h
directory=/app
user=appuser
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=5
stopwaitsecs=60
stopasgroup=true
killasgroup=true
environment=PYTHONPATH="/app/backend:/app",LOG_TAG="bars"

# ============ Celery Beat ============
[program:celery-beat]
command=/opt/venv/bin/celery -A worker.celery_app beat --loglevel=info --schedule=/app/data/celerybeat-schedule
directory=/app
user=appuser
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=5
stopwaitsecs=30
environment=PYTHONPATH="/app/backend:/app",LOG_TAG="beat"

# ============ Nginx ============
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=3
stopwaitsecs=10
