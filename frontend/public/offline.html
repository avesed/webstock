<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WebStock - Offline</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #0f172a;
      --muted: #64748b;
      --primary: #3b82f6;
      --card: #f8fafc;
      --border: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --primary: #60a5fa;
        --card: #1e293b;
        --border: #334155;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1rem;
      padding-top: env(safe-area-inset-top, 0);
    }
    .container {
      text-align: center;
      max-width: 400px;
      padding: 2rem;
      background: var(--card);
      border-radius: 1rem;
      border: 1px solid var(--border);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      color: var(--muted);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.625rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:active { opacity: 0.8; }
    .lang-toggle {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
    </svg>
    <h1 id="title">Network Unavailable</h1>
    <p id="desc">You are currently offline. Please check your internet connection and try again.</p>
    <button onclick="location.reload()" id="retryBtn">Retry</button>
    <br />
    <button class="lang-toggle" onclick="toggleLang()" id="langBtn">切换中文</button>
  </div>
  <script>
    let isZh = navigator.language.startsWith('zh');
    function setLang(zh) {
      isZh = zh;
      document.getElementById('title').textContent = zh ? '网络不可用' : 'Network Unavailable';
      document.getElementById('desc').textContent = zh
        ? '当前无法连接网络，请检查您的网络连接后重试。'
        : 'You are currently offline. Please check your internet connection and try again.';
      document.getElementById('retryBtn').textContent = zh ? '重试' : 'Retry';
      document.getElementById('langBtn').textContent = zh ? 'Switch to English' : '切换中文';
    }
    function toggleLang() { setLang(!isZh); }
    if (isZh) setLang(true);
  </script>
</body>
</html>
